# Render deployment (https://render.com/docs/blueprint-spec)
# One web service: the Next.js dashboard. The data pipeline (scripts/*)
# runs on GitHub Actions cron (.github/workflows/*) — Render cron jobs
# aren't free. Buttons on /admin also trigger any script on demand.
services:
  - type: web
    name: the-yahngorithm
    runtime: node
    plan: free
    region: ohio
    branch: main
    # migrate deploy applies any pending Prisma migrations to the Neon DB
    # (idempotent — no-op when there's nothing new)
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # set in the Render dashboard — same Neon connection string as .env
      - key: NODE_VERSION
        value: "22"
