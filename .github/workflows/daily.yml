# Twice a day: weather forecast + injury report. Both move slowly and
# neither costs against a hard limit.
name: Daily weather + injuries

on:
  schedule:
    - cron: "43 11,23 * * *"
  workflow_dispatch:

jobs:
  go:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      commands: >
        npm run pull-weather &&
        npm run pull-injuries
