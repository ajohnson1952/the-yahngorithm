# Manual trigger for the "heartbeat" group (Kalshi + market flags + model +
# picks). Scheduling is handled by tick.yml + cron-job.org — this is just a
# one-click "refresh the board now" button in the Actions tab.
name: Manual — heartbeat

on:
  workflow_dispatch:

jobs:
  go:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      commands: npm run tick -- --only heartbeat
