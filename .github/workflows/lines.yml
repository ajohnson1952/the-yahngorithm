# Manual trigger for the "scores + lines" groups (pull-games, pull-lines,
# grade-picks, model, picks). Scheduling is handled by tick.yml + cron-job.org.
# --only bypasses the staleness/credit gates, so this always pulls fresh.
name: Manual — scores + lines

on:
  workflow_dispatch:

jobs:
  go:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      commands: npm run tick -- --only scores,lines
