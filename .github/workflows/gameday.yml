# Thu–Sat: line + prediction-market snapshots (this is what makes the steam
# flag work) then re-run the model + picks. Hourly through Saturday.
#   Odds API cost: 2 credits/run. ~19 runs/week -> ~38 credits/week -> ~34% of
#   the 500/mo budget. Kalshi + compute steps are free.
name: Gameday pulls

on:
  schedule:
    - cron: "0 20,23 * * 4" # Thu afternoon / evening ET
    - cron: "0 18,21,23 * * 5" # Fri
    - cron: "0 15-23 * * 6" # Sat hourly (10am–6pm ET)
    - cron: "0 0-4 * * 0" # Sat night into Sun (7–11pm ET)
  workflow_dispatch:

jobs:
  go:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      commands: >
        npm run pull-lines -- --type daily &&
        npm run pull-kalshi &&
        npm run compute-market-flags &&
        npm run run-model &&
        npm run generate-picks
