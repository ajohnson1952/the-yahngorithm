# Sunday late morning ET: Saturday's final scores, advanced-stat
# checkpoint, grade the graded games, refresh team trends. (Model +
# market flags are handled continuously by Heartbeat.)
name: Sun results

on:
  schedule:
    - cron: "43 15 * * 0"
  workflow_dispatch:

jobs:
  go:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      commands: >
        npm run pull-games &&
        npm run pull-advanced &&
        npm run grade-picks &&
        npm run compute-trends
