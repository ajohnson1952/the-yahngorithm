# Manual trigger for the "sunday" group (advanced-stat checkpoint + team
# trends). Scheduling is handled by tick.yml + cron-job.org, which fires this
# group automatically on Sunday late morning.
name: Manual — Sunday trends

on:
  workflow_dispatch:

jobs:
  go:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      commands: npm run tick -- --only sunday
