# Tuesday mid-morning ET: grade last week (incl. any Sun/Mon games),
# then the weekly heavy pull — SP+ / SRS / polls / schedule / advanced
# stats / opening lines / Kalshi — then flags + model + picks.
name: Tue weekly refresh

on:
  schedule:
    - cron: "13 14 * * 2"
  workflow_dispatch:

jobs:
  go:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      commands: >
        npm run grade-picks &&
        npm run pull-ratings &&
        npm run pull-rankings &&
        npm run pull-games &&
        npm run pull-advanced &&
        npm run pull-lines -- --type open &&
        npm run pull-kalshi &&
        npm run compute-flags &&
        npm run compute-market-flags &&
        npm run run-model &&
        npm run generate-picks
