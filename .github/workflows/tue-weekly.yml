# Manual trigger for the "weekly" group — the full heavy pull (ratings /
# polls / schedule / advanced stats / opening lines / Kalshi / flags / model /
# picks / grade). Scheduling is handled by tick.yml + cron-job.org, which
# fires this same group automatically on Tuesday morning.
name: Manual — weekly pull

on:
  workflow_dispatch:

jobs:
  go:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      commands: npm run tick -- --only weekly
